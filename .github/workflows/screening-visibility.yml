name: Screening visibility tests
on:
  pull_request:
  push:
    branches: [main, codex/review-screening-visibility]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend/tests -p test_screening_visibility.py -v
      - run: python -m compileall -q backend/modules
